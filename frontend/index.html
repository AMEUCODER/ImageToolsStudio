<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1c" />
    <meta name="description" content="Edit photos with AI-powered tools: blur, enhance, crop and more." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Image Tools Studio</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong colors.
      try {
        var saved = localStorage.getItem('studio.theme')
        var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
